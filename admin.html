<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>إدارة الحارس الذكي — Smart Guardian</title>
  <link rel="icon" type="image/svg+xml" href="smart-guardian-mark.svg">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#090612;--surface:#150f2c;--surface2:#1c1442;--border:rgba(255,255,255,.12);--ink:#f4f2fb;--muted:#9992b8;--aurora:linear-gradient(120deg,#7c6bff,#33e0ff 55%,#ff5fae)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Tajawal',Tahoma,Arial,sans-serif}
    body{min-height:100vh;background:radial-gradient(900px 520px at 10% -10%,rgba(124,107,255,.22),transparent 62%),radial-gradient(750px 480px at 100% 110%,rgba(51,224,255,.14),transparent 62%),var(--bg);color:var(--ink)}
    .page-head{display:flex;align-items:center;gap:12px;padding:12px max(14px,env(safe-area-inset-right));background:#0e0a1e;border-bottom:1px solid var(--border)}
    .home{display:grid;width:40px;height:40px;place-items:center;border-radius:11px;background:var(--surface2);color:var(--ink);text-decoration:none;border:1px solid var(--border);font-size:20px}
    .page-head strong{font:800 16px 'Almarai',sans-serif;background:var(--aurora);-webkit-background-clip:text;background-clip:text;color:transparent}
    .gate{width:min(610px,calc(100% - 28px));margin:clamp(30px,10vh,90px) auto;padding:26px;display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-areas:"logo title" "logo status" "logo button";align-items:center;gap:10px 24px;border-radius:26px;background:var(--surface);box-shadow:0 30px 70px rgba(2,1,8,.62);border:1px solid var(--border);text-align:right}
    .gate-logo{grid-area:logo;width:100%;max-width:150px;aspect-ratio:1;object-fit:contain;border-radius:24px;background:#0d0a1b;padding:12px}
    .gate h1{grid-area:title;font:800 clamp(21px,3vw,29px) 'Almarai',sans-serif;margin:0;color:var(--ink)}
    .gate p{grid-area:status;min-height:28px;margin:0;color:var(--muted);font-size:14px;line-height:1.7}
    button{grid-area:button;width:100%;margin:5px 0 0;padding:13px;border:0;border-radius:14px;background:var(--aurora);color:#090612;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 14px 32px rgba(124,107,255,.22)}
    button:active{transform:scale(.985)}
    #dashboard{height:calc(100vh - 65px)}iframe{display:block;width:100%;height:100%;border:0}
    @media(max-width:600px){
      .page-head{padding-top:max(12px,env(safe-area-inset-top))}
      .gate{width:calc(100% - 24px);margin:28px auto;padding:18px;grid-template-columns:105px minmax(0,1fr);gap:8px 14px;border-radius:22px}
      .gate-logo{max-width:105px;border-radius:18px;padding:8px}.gate h1{font-size:18px;line-height:1.5}.gate p{font-size:12px}.gate button{font-size:14px;padding:12px}
    }
    @media(max-width:390px){.gate{grid-template-columns:88px minmax(0,1fr);padding:14px}.gate-logo{max-width:88px}.gate h1{font-size:16px}}
  </style>
</head>
<body>
  <script>if(location.protocol==='file:')location.replace('https://study-guardian-groups.web.app/admin.html');</script>
  <header class="page-head"><a class="home" href="./index.html?home=1" aria-label="العودة للرئيسية">⌂</a><strong id="page-title">إدارة الحارس الذكي</strong></header>
  <main id="gate" class="gate">
    <img class="gate-logo" src="smart-guardian-mark.svg" alt="شعار الحارس الذكي">
    <h1 id="gate-title">إدارة الحارس الذكي</h1>
    <p id="status">سجّل بحساب Google الخاص بالإدارة أو الإشراف.</p>
    <button id="login" type="button">دخول الإدارة</button>
  </main>
  <section id="dashboard" hidden><iframe title="لوحة إدارة الحارس الذكي" src="./?admin=1&embedded=1"></iframe></section>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyAUjRlZmePLlKKRDS8JdM4i9r0eCXcnoek",authDomain:"study-guardian-groups.firebaseapp.com",databaseURL:"https://study-guardian-groups-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"study-guardian-groups",appId:"1:499313905189:web:589c4dfade509c853779cc"});
const auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider();
await setPersistence(auth,browserLocalPersistence).catch(()=>{});
provider.setCustomParameters({prompt:"select_account"});
const $=id=>document.getElementById(id),statusEl=$("status"),login=$("login"),gate=$("gate"),dashboard=$("dashboard"),pageTitle=$("page-title"),gateTitle=$("gate-title");
const ADMIN_EMAIL="s2shug@gmail.com",PENDING="smartGuardianAdminRedirect";
let checkId=0,redirectTimer=null;
const isGoogleSession=user=>Boolean(user&&!user.isAnonymous&&user.email);
function showLogin(message="سجّل بحساب Google الخاص بالإدارة أو الإشراف."){
  clearTimeout(redirectTimer);dashboard.hidden=true;gate.hidden=false;pageTitle.textContent="إدارة الحارس الذكي";gateTitle.textContent="إدارة الحارس الذكي";login.hidden=false;login.disabled=false;login.textContent="دخول الإدارة";statusEl.textContent=message;
}
async function hasSupervisorAccess(user){const grant=(await get(ref(db,`admins/${user.uid}`))).val();return Boolean(grant?.active&&(!grant.expiresAt||Number(grant.expiresAt)>Date.now()));}
async function finish(user){
  const current=++checkId;
  if(!isGoogleSession(user)){showLogin();return;}
  try{
    const owner=user.email?.toLowerCase()===ADMIN_EMAIL,supervisor=!owner&&await hasSupervisorAccess(user);
    if(current!==checkId)return;
    if(owner||supervisor){clearTimeout(redirectTimer);localStorage.removeItem(PENDING);gate.hidden=true;dashboard.hidden=false;pageTitle.textContent=owner?"إدارة الحارس الذكي":"إشراف الحارس الذكي";return;}
    dashboard.hidden=true;gate.hidden=false;login.hidden=true;gateTitle.textContent="غير مصرح لك بالدخول";statusEl.textContent="ليس لهذا الحساب صلاحية الإدارة أو الإشراف. ستتم إعادتك للرئيسية.";
    await signOut(auth).catch(()=>{});redirectTimer=setTimeout(()=>location.replace("./index.html?home=1"),2400);
  }catch(_){if(current===checkId)showLogin("تعذر التحقق من صلاحية الحساب. حاول مرة أخرى.");}
}
let redirectUser=null;
try{const result=await getRedirectResult(auth);redirectUser=result?.user||null;if(redirectUser)localStorage.removeItem(PENDING);}catch(_){localStorage.removeItem(PENDING);showLogin("تعذر إكمال تسجيل الدخول. حاول مرة أخرى.");}
if(redirectUser)await finish(redirectUser);
onAuthStateChanged(auth,user=>{if(!redirectUser)finish(user);});
login.onclick=async()=>{
  login.disabled=true;statusEl.textContent="جاري فتح Google…";
  try{
    if(auth.currentUser?.isAnonymous)await signOut(auth);
    const result=await signInWithPopup(auth,provider);await finish(result.user);
  }catch(error){
    const fallback=["auth/popup-blocked","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"];
    if(fallback.includes(error?.code)){login.disabled=false;statusEl.textContent="اسمح بالنوافذ المنبثقة لهذا الموقع، ثم اضغط دخول الإدارة مرة أخرى.";return;}
    login.disabled=false;statusEl.textContent=error?.code==="auth/popup-closed-by-user"?"أُغلقت نافذة Google قبل اكتمال الدخول.":"تعذر فتح Google. حاول مرة أخرى.";
  }
};
</script>
</body></html>
